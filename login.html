<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Log In</title>
    <style>

        html {
            display: flex;
            justify-content: center;
            min-height: 100%;
        }
        
        body {
            color: #efeae0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #181615;
        }
        .board {
            margin: auto 0px;
            max-width: 720px;
            width: 100%;
            background: #282725;
            padding: 0px 32px;
            border-radius: 24px;
            padding-bottom: 24px;
        }

        .board-header {
            margin-bottom: 22px;
            text-align: center;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        h1 {
            font-weight: 600;
            color: #fffaf0;
        }

        .form-group {
            margin-bottom: 14px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            font-size: 1rem;
            font-family: inherit;
            background: #181715;
            border: 1px solid #3f3e3c;
            border-radius: 18px;
            outline: none;
            height: auto;field-sizing: content;
            color: #efeae0;
        }

        .submit-btn {
            width: 100%;
            padding: 14px 10px;
            font-size: 1.1rem;
            font-weight: 600;
            background: #7f5f00;
            color: white;
            border: none;
            border-radius: 40px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 8px rgba(20, 40, 60, 0.08);
            margin-top: 6px;
        }

        .submit-btn:active {
            background: #3f2f00;
            transform: scale(0.98);
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a2a3b;
            letter-spacing: -0.2px;
        }

        .lsolation-line {
            margin: 32px 0px;
        }

        hr {
            color: #6f6a60;
        }

        /* 辅助去除默认button效果 (无js) */
        button {
            user-select: none;
        }

    </style>
</head>
<body>
    <div class="board">
        <!-- 头部 -->
        <div class="board-header">
            <h1>Log in</h1>
        </div>
        <hr>

        <form class="login-form" action="login" method="post">
            <div class="form-group">
                <p class="label">Account</p>
                <input type="text" id="nameInput" name="user-name" placeholder="Account" value="">
            </div>
            <div class="form-group">
                <p class="label">Password</p>
                <input type="password" id="msgInput" name="password" placeholder="Password"></textarea>
            </div>
            <button type="submit" class="submit-btn">Log in</button>
        </form>
    </div>
</body>
</html>
